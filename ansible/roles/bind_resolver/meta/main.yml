---
galaxy_info:
  role_name: bind_resolver
  namespace: pderuiter
  author: Patrick de Ruiter
  description: Caching recursive BIND 9 resolver restricted to trusted networks, with DNSSEC validation and rate limiting
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions:
        - noble
    - name: EL
      versions:
        - "9"
  galaxy_tags:
    - dns
    - bind

dependencies:
  - role: bind
    vars:
      # RHEL keeps its hint zone in named.conf; point it at the downloaded hints
      bind_redhat_hint_file: "{{ 'named.root' if bind_resolver_update_root_hints else 'named.ca' }}"
